spring:
  application:
    name: backend

  datasource:
    url: ${JOBAGENT_DB_URL:jdbc:postgresql://localhost:5544/jobagent}
    username: ${JOBAGENT_DB_USER:jobagent}
    password: ${JOBAGENT_DB_PASSWORD:jobagent}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${JOBAGENT_REDIS_HOST:localhost}
      port: ${JOBAGENT_REDIS_PORT:6479}

  docker:
    compose:
      enabled: true
      file: compose.yaml
      lifecycle-management: start-and-stop

server:
  port: ${JOBAGENT_SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

jobagent:
  cors:
    allowed-origins: ${JOBAGENT_CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}
  jwt:
    # Dev-only symmetric secret. Override with JOBAGENT_JWT_SECRET in every real environment.
    secret: ${JOBAGENT_JWT_SECRET:dev-only-secret-key-change-me-please-this-must-be-at-least-256-bits-long}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 14
    issuer: job-agent
